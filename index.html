<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku Generator</title>
<style>
  :root {
    --ink: #1a1a1a;
    --line: #333;
    --line-light: #bbb;
    --accent: #2563eb;
    --bg: #f5f6f8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 16px;
  }

  /* ---------- Controls ---------- */
  .controls {
    max-width: 900px;
    margin: 0 auto 20px;
    background: #fff;
    border-radius: 10px;
    padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
  }
  .controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
  }
  .controls select {
    padding: 8px 10px;
    border: 1px solid var(--line-light);
    border-radius: 6px;
    font-size: 14px;
    min-width: 130px;
  }
  .controls button {
    padding: 9px 18px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
  }
  .controls button.secondary { background: #555; }
  .controls button:hover { filter: brightness(1.1); }
  .status { width: 100%; font-size: 13px; color: #555; min-height: 18px; }

  /* ---------- Puzzle sheets ---------- */
  #sheets { max-width: 900px; margin: 0 auto; }
  .sheet {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    background: #fff;
    padding: 24px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 20px;
  }
  .puzzle { text-align: center; }
  .puzzle h3 { margin: 0 0 8px; font-size: 15px; }
  table.sudoku {
    border-collapse: collapse;
    margin: 0 auto;
  }
  table.sudoku td {
    width: 34px;
    height: 34px;
    border: 1px solid var(--line-light);
    text-align: center;
    font-size: 17px;
    font-family: Georgia, serif;
    user-select: none;
  }
  table.sudoku td.b-right { border-right: 2px solid var(--line); }
  table.sudoku td.b-bottom { border-bottom: 2px solid var(--line); }
  table.sudoku td.given { font-weight: 700; }
  .qrwrap { margin-top: 8px; }
  .qrwrap img {
    display: block;
    margin: 0 auto;
    image-rendering: pixelated;
  }
  .hint { font-size: 11px; color: #888; margin-top: 2px; }

  /* ---------- Print ---------- */
  @media print {
    body { background: #fff; padding: 0; }
    .controls, .no-print { display: none !important; }
    .sheet {
      box-shadow: none;
      border-radius: 0;
      padding: 10mm;
      margin: 0;
      page-break-after: always;
    }
    .sheet:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>

<div class="controls">
  <label>Difficulty
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
  </label>
  <label>Games per page
    <select id="perPage">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="4" selected>4</option>
      <option value="6">6</option>
    </select>
  </label>
  <label>Pages
    <select id="pages">
      <option value="1" selected>1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="5">5</option>
    </select>
  </label>
  <button id="generateBtn">Generate</button>
  <button id="printBtn" class="secondary">Print</button>
  <div class="status" id="status"></div>
</div>

<div id="sheets"></div>

<script src="qrcode.min.js"></script>
<script src="engine.js"></script>
<script>
"use strict";

/* --- Rendering ------------------------------------------------ */

function buildTable(cells, showGivens) {
  const tbl = document.createElement("table");
  tbl.className = "sudoku";
  for (let r = 0; r < 9; r++) {
    const tr = tbl.insertRow();
    for (let c = 0; c < 9; c++) {
      const td = tr.insertCell();
      const v = cells[r * 9 + c];
      if (v > 0) {
        td.textContent = v;
        if (showGivens) td.className = "given";
      }
      if (c === 2 || c === 5) td.classList.add("b-right");
      if (r === 2 || r === 5) td.classList.add("b-bottom");
    }
  }
  return tbl;
}

function renderPuzzles(list) {
  const sheetsEl = document.getElementById("sheets");
  sheetsEl.innerHTML = "";
  const perPage = parseInt(document.getElementById("perPage").value, 10);

  for (let s = 0; s < list.length; s += perPage) {
    const sheet = document.createElement("div");
    sheet.className = "sheet";
    list.slice(s, s + perPage).forEach((item, k) => {
      const num = s + k + 1;
      const div = document.createElement("div");
      div.className = "puzzle";
      const h = document.createElement("h3");
      h.textContent = "#" + num;
      div.appendChild(h);
      div.appendChild(buildTable(item.puzzle, true));

      // QR code containing a URL whose hash holds the encoded solution.
      // Opening it shows the full solution page (works offline too).
      const qrWrap = document.createElement("div");
      qrWrap.className = "qrwrap";
      const solURL = location.origin + location.pathname + "#s=" + encodeSolution(item.solution);
      const qr = qrcode(0, "M");
      qr.addData(solURL);
      qr.make();
      const cell = 2, margin = 0;
      const size = qr.getModuleCount() * cell + margin * 2;
      const img = document.createElement("img");
      img.src = qr.createDataURL(cell, margin);
      img.width = size; img.height = size;
      img.alt = "Solution QR code";
      qrWrap.appendChild(img);

      const cap = document.createElement("div");
      cap.className = "hint";
      cap.textContent = "scan for solution";
      qrWrap.appendChild(cap);
      div.appendChild(qrWrap);

      sheet.appendChild(div);
    });
    sheetsEl.appendChild(sheet);
  }
}

function statusMsg(msg) {
  document.getElementById("status").textContent = msg;
}

/* --- Wire-up --------------------------------------------------- */

document.getElementById("generateBtn").addEventListener("click", () => {
  const difficulty = document.getElementById("difficulty").value;
  const perPage = parseInt(document.getElementById("perPage").value, 10);
  const pages = parseInt(document.getElementById("pages").value, 10);
  const total = perPage * pages;

  statusMsg("Generating " + total + " puzzle" + (total > 1 ? "s" : "") + "…");
  const t0 = performance.now();

  generateInWorkers(difficulty, total, (list) => {
    renderPuzzles(list);
    statusMsg(total + " " + difficulty + " puzzle" + (total > 1 ? "s" : "") +
      " generated in " + ((performance.now() - t0) / 1000).toFixed(2) + "s.");
  });
});

// Generate `total` puzzles of `difficulty` across a pool of Web Workers.
// Falls back to synchronous generation when Workers are unavailable
// (e.g. opening the page over the file:// protocol).
function generateInWorkers(difficulty, total, onDone) {
  function sync() {
    const list = [];
    for (let i = 0; i < total; i++) {
      const { puzzle, solution } = generatePuzzle(difficulty);
      list.push({ puzzle, solution });
    }
    onDone(list);
  }

  const cores = (typeof navigator !== "undefined" && navigator.hardwareConcurrency) || 4;
  const nWorkers = Math.min(cores, total, 8);
  const chunk = Math.ceil(total / nWorkers);
  const results = new Array(total);
  const jobs = [];
  let pending = 0;
  let finished = false;

  for (let w = 0; w < nWorkers; w++) {
    const start = w * chunk;
    const count = Math.min(chunk, total - start);
    if (count <= 0) break;
    let worker;
    try {
      worker = new Worker("worker.js");
    } catch (e) {
      jobs.forEach(j => j.worker.terminate());
      sync();
      return;
    }
    jobs.push({ worker, start, count });
  }

  pending = jobs.length;
  jobs.forEach(({ worker, start, count }) => {
    worker.onmessage = (e) => {
      const list = e.data.list;
      for (let i = 0; i < list.length; i++) results[e.data.start + i] = list[i];
      pending--;
      if (pending === 0) {
        finished = true;
        jobs.forEach(j => j.worker.terminate());
        onDone(results);
      }
    };
    worker.onerror = () => {
      // Regenerate this chunk synchronously as a fallback
      for (let i = 0; i < count; i++) {
        const { puzzle, solution } = generatePuzzle(difficulty);
        results[start + i] = { puzzle, solution };
      }
      worker.terminate();
      pending--;
      if (pending === 0 && !finished) {
        finished = true;
        jobs.forEach(j => j.worker.terminate());
        onDone(results);
      }
    };
    worker.postMessage({ difficulty, start, count });
  });
}

document.getElementById("printBtn").addEventListener("click", () => window.print());

/* --- Solution view: #s=<encoded solution> ---------------------- */
// The URL itself carries the solution; nothing is stored server-side.
(function showSolutionFromHash() {
  const m = location.hash.match(/^#s=([A-Za-z0-9\-_]+)$/);
  if (!m) return;
  document.querySelector(".controls").style.display = "none";
  const sheets = document.getElementById("sheets");
  sheets.innerHTML = "";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  const div = document.createElement("div");
  div.className = "puzzle";
  const h = document.createElement("h3");
  h.textContent = "Solution";
  div.appendChild(h);
  try {
    div.appendChild(buildTable(decodeSolution(m[1]), false));
  } catch (e) {
    const err = document.createElement("p");
    err.textContent = "Invalid solution code: " + e.message;
    div.appendChild(err);
  }
  sheet.appendChild(div);
  sheets.appendChild(sheet);
})();</script>
</body>
</html>
